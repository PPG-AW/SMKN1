<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Web Interaktif 10 | Latihan Generator | Simpangan Rata-Rata</title>
<style>
:root{--primary:#0f766e;--primary-dark:#134e4a;--primary-light:#14b8a6;--orange:#ea580c;--success:#16a34a;--danger:#dc2626;--soft-teal:#f0fdfa;--soft-green:#ecfdf5;--soft-red:#fef2f2;--soft-yellow:#fffbeb;--text:#1e293b;--muted:#64748b;--border:#cbd5e1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:var(--text);line-height:1.6;font-size:15px;}
.top-bar{background:var(--primary-dark);color:#fff;padding:12px 16px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.top-bar h1{font-size:16px;margin:0 0 2px;}.top-bar p{font-size:11px;opacity:.8;}
.back-link{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#fff;text-decoration:none;font-size:20px;}
.container{max-width:600px;margin:0 auto;padding:14px;}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.mode-tabs{display:flex;gap:8px;margin-bottom:16px;}
.mode-tab{flex:1;padding:12px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;font-size:14px;font-weight:700;transition:.2s;}
.mode-tab.active{border-color:var(--primary);background:var(--soft-teal);color:var(--primary-dark);}
.konteks-group{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.ktag{padding:7px 14px;border:1.5px solid var(--border);border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;}
.ktag.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-gen{background:var(--primary);color:#fff;border:none;padding:13px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-bottom:14px;}
.btn-gen:hover{background:var(--primary-light);}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;}
th,td{border:1.5px solid var(--border);padding:9px;text-align:center;}
th{background:#ccfbf1;color:var(--primary-dark);font-weight:700;}
input[type=number]{width:100%;padding:8px;border:2px solid var(--border);border-radius:6px;font-size:14px;text-align:center;}
input[type=number]:focus{outline:none;border-color:var(--primary);}
input.ok{border-color:var(--success);background:#ecfdf5;}
input.err{border-color:var(--danger);background:#fef2f2;}
.label-row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap;}
.label-row label{font-size:14px;font-weight:700;}
.label-row input{width:130px;padding:9px;border:2px solid var(--border);border-radius:8px;font-size:15px;}
.btn-check{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-next{background:var(--success);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-left:8px;}
.feedback-box{padding:12px 14px;border-radius:8px;margin:10px 0;font-size:14px;}
.fb-ok{background:var(--soft-green);border:1px solid #86efac;color:#166534;}
.fb-err{background:var(--soft-red);border:1px solid #fca5a5;color:#991b1b;}
.stat-row{display:flex;gap:10px;margin-bottom:14px;}
.stat-box{flex:1;background:var(--soft-teal);border-radius:10px;padding:12px;text-align:center;}
.stat-num{font-size:26px;font-weight:800;color:var(--primary-dark);}
.stat-lbl{font-size:11px;color:var(--muted);}
.progress-wrap{background:#e2e8f0;border-radius:999px;height:8px;margin:8px 0;}
.progress-fill{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--primary-light),var(--primary));transition:width .4s;}
.info-box{background:var(--soft-teal);border-left:4px solid var(--primary);padding:12px;border-radius:6px;margin:10px 0;font-size:13px;}
.warning-box{background:var(--soft-red);border-left:4px solid var(--danger);padding:12px;border-radius:6px;margin:10px 0;font-size:13px;}
.success-box{background:var(--soft-green);border-left:4px solid var(--success);padding:12px;border-radius:6px;margin:10px 0;font-size:13px;}
</style>
</head>
<body>
<div class="top-bar">
  <a href="Pertemuan10.html" class="back-link">&#8592;</a>
  <h1>Web Latihan Generator — P10</h1>
  <p>Simpangan Rata-Rata Data Tunggal</p>
</div>
<div class="container">

  <!-- SETUP -->
  <div class="card" id="setupCard">
    <h3 style="color:var(--primary-dark);margin-bottom:14px;">⚙️ Pilih Mode Latihan</h3>
    <div class="mode-tabs">
      <div class="mode-tab active" id="tabTerbimbing" onclick="setMode('terbimbing')">📋 Terbimbing<br><span style="font-size:11px;font-weight:400;">Tabel bantu interaktif langkah per langkah</span></div>
      <div class="mode-tab" id="tabMandiri" onclick="setMode('mandiri')">🎯 Mandiri<br><span style="font-size:11px;font-weight:400;">Langsung hitung mean dan SR</span></div>
    </div>
    <h4 style="font-size:14px;margin-bottom:8px;color:var(--muted);">Pilih konteks soal:</h4>
    <div class="konteks-group">
      <div class="ktag active" onclick="setKonteks(this,'TikTok')">📱 TikTok</div>
      <div class="ktag" onclick="setKonteks(this,'Shopee')">🛍️ Shopee</div>
      <div class="ktag" onclick="setKonteks(this,'Olahraga')">⚽ Olahraga</div>
      <div class="ktag" onclick="setKonteks(this,'Kuliner')">🍜 Kuliner</div>
      <div class="ktag" onclick="setKonteks(this,'QRIS')">💳 QRIS</div>
    </div>
    <button class="btn-gen" onclick="generateSoal()">🎲 Generate Soal Baru</button>
  </div>

  <!-- STATS -->
  <div class="card" id="statsCard">
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num" id="statBenar">0</div><div class="stat-lbl">Benar</div></div>
      <div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total Soal</div></div>
      <div class="stat-box"><div class="stat-num" id="statAkurasi">0%</div><div class="stat-lbl">Akurasi</div></div>
      <div class="stat-box"><div class="stat-num" id="statSet">0/3</div><div class="stat-lbl">Set Selesai</div></div>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <!-- SOAL -->
  <div class="card" id="soalCard" style="display:none;">
    <div id="soalHeader" style="font-size:13px;color:var(--muted);margin-bottom:8px;"></div>
    <div id="soalBody"></div>
    <div id="feedbackArea"></div>
    <div style="margin-top:14px;" id="actionArea"></div>
  </div>

  <div id="setDoneCard" style="display:none;"></div>
</div>

<script>
const params=new URLSearchParams(location.search);
const NAMA=params.get('nama')||'';
const API='https://script.google.com/macros/s/AKfycbz7RhLWJsZvBGHPKUy7J8vN8KpNJMNo1xOF2s-OKZYciE8zRRXLXOOGTEjefns8u3s9TQ/exec';

let mode='terbimbing',konteks='TikTok';
let stats={benar:0,total:0,setSelesai:0,soalDiSet:0};
let currentSoal=null;

const KONTEKS_DATA={
  'TikTok':{satuan:'menit menonton',prefix:'durasi menonton TikTok (menit)',label:'menit'},
  'Shopee':{satuan:'item',prefix:'jumlah item terjual (unit)',label:'unit'},
  'Olahraga':{satuan:'poin',prefix:'skor pertandingan (poin)',label:'poin'},
  'Kuliner':{satuan:'porsi',prefix:'jumlah porsi terjual',label:'porsi'},
  'QRIS':{satuan:'ribu rupiah',prefix:'transaksi QRIS (ribu rupiah)',label:'ribu Rp'}
};

function callAPI(p,cb){
  const c='cb_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
  p.callback=c;
  const u=API+'?'+Object.keys(p).map(k=>k+'='+encodeURIComponent(p[k])).join('&');
  const sc=document.createElement('script');
  window[c]=function(d){delete window[c];sc.parentNode&&sc.parentNode.removeChild(sc);cb&&cb(d);};
  sc.onerror=function(){delete window[c];sc.parentNode&&sc.parentNode.removeChild(sc);cb&&cb(null);};
  sc.src=u;document.head.appendChild(sc);
}

function setMode(m){
  mode=m;
  document.getElementById('tabTerbimbing').classList.toggle('active',m==='terbimbing');
  document.getElementById('tabMandiri').classList.toggle('active',m==='mandiri');
}
function setKonteks(el,k){
  konteks=k;
  document.querySelectorAll('.ktag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function generateData(){
  // Buat data dengan mean bulat
  const n=5;
  const mean=10+Math.floor(Math.random()*9)*5; // 10,15,20,...,50
  const offsets=[];
  const maxOff=Math.floor(mean*0.4);
  for(let i=0;i<n;i++) offsets.push(-maxOff+Math.floor(Math.random()*(maxOff*2+1)));
  // Adjust agar jumlah offset=0
  const sum=offsets.reduce((a,b)=>a+b,0);
  offsets[n-1]-=sum;
  const data=offsets.map(o=>mean+o);
  const selisih=data.map(x=>x-mean);
  const mutlak=selisih.map(s=>Math.abs(s));
  const jmt=mutlak.reduce((a,b)=>a+b,0);
  const sr=parseFloat((jmt/n).toFixed(2));
  return{data,mean,selisih,mutlak,jmt,sr,n};
}

function updateStats(){
  document.getElementById('statBenar').textContent=stats.benar;
  document.getElementById('statTotal').textContent=stats.total;
  const ak=stats.total?Math.round(stats.benar/stats.total*100):0;
  document.getElementById('statAkurasi').textContent=ak+'%';
  document.getElementById('statSet').textContent=stats.setSelesai+'/3';
  document.getElementById('progFill').style.width=(stats.setSelesai/3*100)+'%';
}

function generateSoal(){
  const d=generateData();
  currentSoal=d;
  stats.soalDiSet++;
  document.getElementById('soalCard').style.display='block';
  const kd=KONTEKS_DATA[konteks];
  document.getElementById('soalHeader').textContent=`Soal ${stats.total+1} | Mode: ${mode} | Konteks: ${konteks}`;

  if(mode==='terbimbing'){
    renderTerbimbing(d,kd);
  } else {
    renderMandiri(d,kd);
  }
  document.getElementById('feedbackArea').innerHTML='';
  document.getElementById('actionArea').innerHTML=`<button class="btn-check" onclick="checkJawaban()">Cek Jawaban</button>`;
}

function renderTerbimbing(d,kd){
  let html=`<p style="font-size:14px;margin-bottom:10px;">Data ${kd.prefix}: <strong>${d.data.join(', ')}</strong> (n=${d.n})</p>`;
  html+=`<div class="label-row"><label>Mean =</label><input type="number" id="ginMean" step="0.01"></div>`;
  html+=`<table><tr><th>Data ke-</th><th>xᵢ</th><th>xᵢ − x̄</th><th>|xᵢ − x̄|</th></tr>`;
  d.data.forEach((xi,i)=>{
    html+=`<tr><td>${i+1}</td><td>${xi}</td><td><input type="number" id="gin_s${i+1}" step="1"></td><td><input type="number" id="gin_m${i+1}" min="0"></td></tr>`;
  });
  html+=`<tr><th>Jumlah</th><th>${d.data.reduce((a,b)=>a+b,0)}</th><td><input type="number" id="gin_sjml" step="1"></td><td><input type="number" id="gin_mjml" min="0"></td></tr></table>`;
  html+=`<div class="label-row"><label>SR =</label><input type="number" id="ginSR" step="0.01"></div>`;
  document.getElementById('soalBody').innerHTML=html;
}

function renderMandiri(d,kd){
  let html=`<p style="font-size:14px;margin-bottom:10px;">Data ${kd.prefix}: <strong>${d.data.join(', ')}</strong> (n=${d.n})</p>`;
  html+=`<div class="label-row"><label>Mean =</label><input type="number" id="ginMean" step="0.01"></div>`;
  html+=`<div class="label-row"><label>SR =</label><input type="number" id="ginSR" step="0.01"></div>`;
  document.getElementById('soalBody').innerHTML=html;
}

function getNum(id){const el=document.getElementById(id);return el?parseFloat(el.value)||0:null;}

function checkJawaban(){
  const d=currentSoal;
  let benar=true,fb='';
  const meanInput=getNum('ginMean');
  const srInput=getNum('ginSR');
  const isCorrectMean=Math.abs(meanInput-d.mean)<0.01;
  const isCorrectSR=Math.abs(srInput-d.sr)<0.01;

  if(mode==='terbimbing'){
    let allOk=true;
    const selisihInputs=d.data.map((_,i)=>getNum('gin_s'+(i+1)));
    const mutlakInputs=d.data.map((_,i)=>getNum('gin_m'+(i+1)));
    const jmtInput=getNum('gin_mjml');

    if(!isCorrectMean){allOk=false;fb+='❌ Mean salah. Mean = '+d.mean+'<br>';}
    d.selisih.forEach((jv,i)=>{
      const el=document.getElementById('gin_s'+(i+1));
      if(Math.abs(selisihInputs[i]-jv)>0.01){allOk=false;el&&el.classList.add('err');fb+='❌ Selisih baris '+(i+1)+' salah. Jawaban: '+jv+'<br>';}
      else el&&el.classList.add('ok');
    });
    d.mutlak.forEach((jv,i)=>{
      const el=document.getElementById('gin_m'+(i+1));
      if(Math.abs(mutlakInputs[i]-jv)>0.01){allOk=false;el&&el.classList.add('err');fb+='❌ Nilai mutlak baris '+(i+1)+' salah. Jawaban: '+jv+'<br>';}
      else el&&el.classList.add('ok');
    });
    if(Math.abs(jmtInput-d.jmt)>0.01){allOk=false;fb+='❌ Jumlah mutlak salah. Jawaban: '+d.jmt+'<br>';}
    if(!isCorrectSR){allOk=false;fb+='❌ SR salah. Jawaban: '+d.sr+'<br>';}
    benar=allOk;
  } else {
    if(!isCorrectMean)fb+='❌ Mean salah. Jawaban: '+d.mean+'<br>';
    if(!isCorrectSR)fb+='❌ SR salah. Jawaban: '+d.sr+'<br>';
    benar=isCorrectMean&&isCorrectSR;
  }

  stats.total++;
  if(benar)stats.benar++;
  updateStats();

  const fbEl=document.getElementById('feedbackArea');
  if(benar){
    fbEl.innerHTML=`<div class="feedback-box fb-ok">✅ <strong>Benar!</strong> Mean=${d.mean}, SR=${d.sr}</div>`;
  } else {
    fbEl.innerHTML=`<div class="feedback-box fb-err">${fb}<br><strong>Kunci: Mean=${d.mean}, SR=${d.sr}, Σ|x−x̄|=${d.jmt}</strong></div>`;
  }

  document.getElementById('actionArea').innerHTML=`<button class="btn-next" onclick="nextSoal()">Soal Berikutnya →</button>`;

  // Cek apakah 1 set selesai (10 soal per set)
  if(stats.soalDiSet>=10){
    const ak=Math.round(stats.benar/stats.total*100);
    if(ak>=80)stats.setSelesai++;
    stats.soalDiSet=0;
    saveSet(ak);
    if(stats.setSelesai>=3)showSelesai();
  }
}

function nextSoal(){generateSoal();}

function saveSet(ak){
  if(!NAMA)return;
  callAPI({action:'latihan',nama:NAMA,mode,jenis:'tabel_bantu',konteks,
    benar:stats.benar,skor:Math.round(stats.benar/stats.total*100),akurasi:ak,
    setKe:stats.setSelesai,langkahSalah:'',detail:JSON.stringify(stats)},()=>{});
}

function showSelesai(){
  document.getElementById('setDoneCard').style.display='block';
  document.getElementById('setDoneCard').innerHTML=`
    <div class="card" style="text-align:center;">
      <div style="font-size:40px;margin-bottom:10px;">🎉</div>
      <h2 style="color:var(--primary-dark);margin-bottom:8px;">3 Set Latihan Selesai!</h2>
      <div class="success-box">Tindak lanjut latihan sudah terpenuhi. Akurasi kamu: ${Math.round(stats.benar/stats.total*100)}%</div>
      <a href="Pertemuan10.html?nama=${encodeURIComponent(NAMA)}" style="background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;display:inline-block;margin-top:10px;">Kembali ke Halaman Utama</a>
    </div>`;
}

updateStats();
</script>
</body>
</html>
