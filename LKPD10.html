<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LKPD 10 | Simpangan Rata-Rata | SMKN 1 Salatiga</title>
<style>
:root{--primary:#0f766e;--primary-dark:#134e4a;--primary-light:#14b8a6;--orange:#ea580c;--success:#16a34a;--danger:#dc2626;--soft-teal:#f0fdfa;--soft-green:#ecfdf5;--soft-red:#fef2f2;--soft-yellow:#fffbeb;--text:#1e293b;--muted:#64748b;--border:#cbd5e1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:var(--text);line-height:1.6;font-size:15px;}
.top-bar{background:var(--primary-dark);color:#fff;padding:12px 16px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.top-bar h1{font-size:16px;margin:0 0 2px;}.top-bar p{font-size:11px;opacity:.8;}
.back-link{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#fff;text-decoration:none;font-size:20px;font-weight:700;}
.container{max-width:560px;margin:0 auto;padding:14px;}
.login-box{background:#fff;border-radius:14px;padding:24px;margin:20px auto;max-width:400px;box-shadow:0 4px 16px rgba(0,0,0,.08);text-align:center;}
.login-box h2{color:var(--primary-dark);margin-bottom:12px;}
.login-box input{width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;font-size:15px;margin-bottom:8px;}
.login-box input:focus{outline:none;border-color:var(--primary);}
.name-list{max-height:200px;overflow-y:auto;border:1.5px solid var(--border);border-radius:8px;margin-bottom:12px;text-align:left;}
.name-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:14px;}
.name-item:hover{background:var(--soft-teal);}
.name-item.selected{background:#ccfbf1;font-weight:700;color:var(--primary);}
.btn{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.level-badge{display:inline-block;padding:10px 28px;border-radius:999px;font-size:18px;font-weight:700;margin:14px 0;}
.lv1{background:#fef2f2;color:#991b1b;border:2px solid #fca5a5;}
.lv2{background:#fef3c7;color:#92400e;border:2px solid #fcd34d;}
.lv3{background:#dcfce7;color:#166534;border:2px solid #86efac;}
.info-box{background:var(--soft-teal);border-left:4px solid var(--primary);padding:12px;border-radius:6px;margin:10px 0;font-size:13px;}
.warning-box{background:var(--soft-red);border-left:4px solid var(--danger);padding:12px;border-radius:6px;margin:10px 0;font-size:13px;}
.btn-go{background:var(--success);color:#fff;border:none;padding:13px 28px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:6px;}
.btn-orange{background:var(--orange)!important;}
.spinner{display:block;width:22px;height:22px;border:3px solid #e2e8f0;border-top:3px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:30px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="top-bar">
  <a href="Pertemuan10.html" class="back-link">&#8592;</a>
  <h1>LKPD Pertemuan 10</h1>
  <p>Simpangan Rata-Rata Data Tunggal</p>
</div>
<div class="container" id="loginSection">
  <div class="login-box">
    <h2>Masuk ke LKPD</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Ketik nama lalu pilih dari daftar</p>
    <input type="text" id="searchName" placeholder="Ketik nama kamu..." autocomplete="off"/>
    <div class="name-list" id="nameList"></div>
    <button class="btn" id="btnLogin" disabled>Masuk</button>
    <p style="font-size:12px;color:var(--muted);margin-top:8px;" id="loginMsg"></p>
  </div>
</div>
<div class="container" id="resultSection" style="display:none;"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbz7RhLWJsZvBGHPKUy7J8vN8KpNJMNo1xOF2s-OKZYciE8zRRXLXOOGTEjefns8u3s9TQ/exec';
const FALLBACK=['AGUSTYA RAMADHANI','ANINDYA AZZAHRA','ANJA ALZENA TANJUNG','AURELIA KEYSHA VERNANDYA','AYU WIDYASARI','AZZAHRA ISMAYANTI','CARISSA ARVITA PUTRI','DAVINA ALYA PUTRI','DITA NANDA PUTRI','EKA WULANSARI','FEBBY AULIA DAMAYANTI','JENNYTA WULANDARI','LAURA OKTAVIANI','MAITSA KHALISTA PUTRI','MARVA MAULIDA','MELYNDA ANANTA SARI','NABILLA AYU EVANIA','NAMIRA SETARIANTI','NANDITA FITRIA RAMADANI','NAYLA AZKIYA HAFIZHAH','NOLA FEBI AYU DANITYA','NOVI MARTHALITA','OCTAVIA FITRIYANI','REKA MUSTIKA FAHLUIZA','RORO ENDAH MUSTIKA NINGRUM','SALSABILA CHALISA RAHMA WIBOWO','SEFA FEBI SAPUTRI','SUCI NAZILAH','TARA ARGYA NUR AGUSTIN','TIRTA ARUM KUMALA DEWI','WISNU BIMA NURIN PRATAMA'];

// Pre-fill from URL params
const urlP=new URLSearchParams(location.search);
const urlNama=urlP.get('nama')||'';

let allNames=[],selectedName=urlNama;
const loginSection=document.getElementById('loginSection');
const resultSection=document.getElementById('resultSection');
const searchName=document.getElementById('searchName');
const nameList=document.getElementById('nameList');
const btnLogin=document.getElementById('btnLogin');

function callAPI(p,cb){
  const c='cb_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
  p.callback=c;
  const u=API+'?'+Object.keys(p).map(k=>k+'='+encodeURIComponent(p[k])).join('&');
  const sc=document.createElement('script');
  window[c]=function(d){delete window[c];sc.parentNode&&sc.parentNode.removeChild(sc);cb&&cb(d);};
  sc.onerror=function(){delete window[c];sc.parentNode&&sc.parentNode.removeChild(sc);cb&&cb(null);};
  sc.src=u;document.head.appendChild(sc);
}

function loadNames(){
  callAPI({action:'getNames'},function(d){
    allNames=(d&&d.ok&&d.names&&d.names.length)?d.names:FALLBACK;
    renderNames('');
    if(urlNama){searchName.value=urlNama;btnLogin.disabled=false;renderNames(urlNama);}
  });
  setTimeout(()=>{if(!allNames.length){allNames=FALLBACK;renderNames('');if(urlNama){searchName.value=urlNama;btnLogin.disabled=false;}}},5000);
}

function renderNames(f){
  const fl=f.trim().toUpperCase();
  const list=fl?allNames.filter(n=>n.toUpperCase().includes(fl)):allNames;
  nameList.innerHTML='';
  list.forEach(name=>{
    const d=document.createElement('div');
    d.className='name-item'+(name===selectedName?' selected':'');
    d.textContent=name;
    d.onclick=()=>{selectedName=name;searchName.value=name;btnLogin.disabled=false;renderNames(name);};
    nameList.appendChild(d);
  });
}

searchName.addEventListener('input',()=>{selectedName='';btnLogin.disabled=true;renderNames(searchName.value);});

btnLogin.addEventListener('click',()=>{
  if(!selectedName)return;
  btnLogin.disabled=true;
  loginSection.style.display='none';
  resultSection.style.display='block';
  resultSection.innerHTML='<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';
  callAPI({action:'getPretest',nama:selectedName},function(d){
    if(d&&d.ok&&d.data){
      showLevel(selectedName,Number(d.data.SKOR||0),d.data.LEVEL_LKPD||'LEVEL 1');
    } else {
      showNoPretest(selectedName);
    }
  });
  setTimeout(()=>{if(resultSection.querySelector('.spinner'))showNoPretest(selectedName);},6000);
});

function lvNum(lv){return lv.includes('3')?3:lv.includes('2')?2:1;}
function lvDesc(n){
  if(n===1)return'Panduan tabel bantu sangat lengkap per langkah dengan guide di setiap sel.';
  if(n===2)return'Tabel bantu kosong dengan rumus tersedia. Kamu mengisi sendiri.';
  return'Tabel bantu kosong tanpa panduan, ditambah soal interpretasi dan perbandingan SR dengan simpangan baku.';
}

function showLevel(nama,skor,level){
  const num=lvNum(level);
  const url='LKPD10L'+num+'.html?nama='+encodeURIComponent(nama)+'&level='+num+'&skor='+skor;
  resultSection.innerHTML=`
    <div class="card" style="text-align:center;">
      <h2 style="color:var(--primary-dark);margin-bottom:8px;">LKPD Siap Dikerjakan</h2>
      <p style="font-size:13px;color:var(--muted);">Nama: <strong>${nama}</strong></p>
      <p style="font-size:13px;color:var(--muted);">Skor Pre Test: <strong>${skor} poin</strong></p>
      <div class="level-badge lv${num}">Level ${num}</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">${lvDesc(num)}</p>
      <div class="info-box" style="text-align:left;"><strong>Isi LKPD:</strong> Soal 1 dan 2 tabel bantu simpangan rata-rata.${num===3?'<br>Soal 3 interpretasi & perbandingan SR dengan simpangan baku.':''}</div>
      <a href="${url}" class="btn-go">Mulai LKPD Level ${num} →</a>
    </div>`;
}

function showNoPretest(nama){
  resultSection.innerHTML=`
    <div class="card" style="text-align:center;">
      <h2 style="color:var(--primary-dark);margin-bottom:8px;">Pre Test Belum Dikerjakan</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Nama: <strong>${nama}</strong></p>
      <div class="warning-box" style="text-align:left;">Kamu harus mengerjakan Pre Test terlebih dahulu sebelum membuka LKPD.</div>
      <a href="Assesment10.html?nama=${encodeURIComponent(nama)}" class="btn-go btn-orange">Kerjakan Pre Test</a>
      <a href="Pertemuan10.html?nama=${encodeURIComponent(nama)}" class="btn-go" style="background:var(--primary);">Kembali</a>
    </div>`;
}

loadNames();
if(urlNama){
  btnLogin.disabled=false;
  btnLogin.click();
}
</script>
</body>
</html>
